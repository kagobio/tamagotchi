<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libritox · emulador</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 25%,#1e1b18 0%,#0c0b09 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:36px 20px 60px;gap:24px;font:11px/1.5 ui-sans-serif,system-ui,sans-serif;color:#444}
h1{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#2e2e2e}
.mount{position:relative;width:230px;height:500px;filter:drop-shadow(0 32px 72px rgba(0,0,0,.8)) drop-shadow(0 8px 24px rgba(0,0,0,.5))}
.iphone{position:absolute;inset:0;background:linear-gradient(170deg,#3a3734 0%,#2e2b28 50%,#2a2724 100%);border-radius:32px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.5)}
.iphone::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to right,rgba(255,255,255,.1) 0%,transparent 15%,transparent 85%,rgba(0,0,0,.08) 100%);pointer-events:none}
.camera-bump{position:absolute;top:18px;left:18px;width:88px;height:88px;background:linear-gradient(145deg,#232120,#1a1917);border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.lens{position:absolute;background:radial-gradient(circle at 35% 30%,#3a3630,#0d0c0b);border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.12),0 2px 4px rgba(0,0,0,.8)}
.lens.l1{width:32px;height:32px;top:10px;left:10px}
.lens.l2{width:32px;height:32px;top:10px;left:46px}
.lens.l3{width:32px;height:32px;top:46px;left:10px}
.lidar{position:absolute;width:18px;height:18px;top:50px;left:54px;background:radial-gradient(circle at 40% 35%,#2a2826,#111);border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.1)}
.camera-flash{position:absolute;top:52px;left:44px;width:10px;height:10px;background:radial-gradient(circle,#ffd060,#d4a030);border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.magsafe-ring{position:absolute;left:50%;top:290px;transform:translate(-50%,-50%);width:148px;height:148px;border-radius:50%;border:1.5px solid rgba(255,255,255,.07);background:radial-gradient(circle,transparent 69px,rgba(255,255,255,.04) 70px,transparent 72px)}
.iphone-btn{position:absolute;background:linear-gradient(to right,#3e3b38,#4a4744);border-radius:2px}
.iphone-btn.vol-up{left:-2px;top:110px;width:4px;height:36px;border-radius:2px 0 0 2px}
.iphone-btn.vol-down{left:-2px;top:155px;width:4px;height:36px;border-radius:2px 0 0 2px}
.iphone-btn.action{left:-2px;top:76px;width:4px;height:28px;border-radius:2px 0 0 2px}
.iphone-btn.power{right:-2px;top:140px;width:4px;height:56px;border-radius:0 2px 2px 0}
.apple-logo{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.12);font-size:20px;line-height:1;user-select:none}
.device{position:absolute;top:145px;left:15px;width:200px;height:340px;background:linear-gradient(170deg,#e0dbd4 0%,#d2cec6 55%,#cac6be 100%);border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.88),inset 0 -1px 0 rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.3)}
.device::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to right,rgba(255,255,255,.15) 0%,transparent 25%,transparent 75%,rgba(0,0,0,.03) 100%);pointer-events:none}
.power-btn{position:absolute;top:80px;right:-2px;width:4px;height:34px;background:linear-gradient(to right,#b4b0a8,#c8c4bc);border-radius:0 3px 3px 0;cursor:pointer;box-shadow:2px 1px 5px rgba(0,0,0,.4);transition:background 70ms,transform 70ms}
.power-btn:active{background:#a0a098;transform:translateX(1px)}
.screen-bezel{position:absolute;top:10px;left:7px;right:7px;height:310px;background:#111;border-radius:4px 4px 0 0;padding:2px 2px 0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.7)}
.screen-wrap{position:relative;width:100%;height:100%;background:#d9d4be;border-radius:2px 2px 0 0;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.screen-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}
.screen-wrap.rf-b::after{background:#111;opacity:1;transition:none}
.screen-wrap.rf-w::after{background:#d9d4be;opacity:1;transition:none}
.screen-wrap.rf-off::after{opacity:0;transition:opacity 55ms}
.btn-bar{position:absolute;top:320px;left:7px;right:7px;height:14px;background:linear-gradient(to bottom,#b0aca4,#beb9b2);border-radius:0 0 2px 2px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:inset 0 1px 0 rgba(0,0,0,.3)}
.hw-btn{flex:1;height:9px;margin:0 4px;background:linear-gradient(to bottom,#cac6be,#d2cec6);border-radius:2px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:7px;color:#888;user-select:none;transition:background 55ms,transform 55ms}
.hw-btn:active,.hw-btn.pressed{background:#a8a4a0;transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(0,0,0,.12)}
.usb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:16px;height:6px;background:#a8a49c;border-radius:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.brand{position:absolute;bottom:6px;right:10px;font-size:6px;letter-spacing:.2em;text-transform:uppercase;color:rgba(0,0,0,.18);font-family:ui-sans-serif,system-ui,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;font-size:10px;color:#2e2e2e;max-width:320px;text-align:center}
.legend kbd{background:#181714;border:1px solid #262420;border-radius:3px;padding:1px 5px;font-family:inherit;font-size:9px;color:#555}
</style>
</head>
<body>
<h1>Libritox · emulador</h1>
<div class="mount">
  <div class="iphone">
    <div class="camera-bump">
      <div class="lens l1"></div><div class="lens l2"></div><div class="lens l3"></div>
      <div class="lidar"></div><div class="camera-flash"></div>
    </div>
    <div class="magsafe-ring"></div>
    <div class="iphone-btn vol-up"></div><div class="iphone-btn vol-down"></div>
    <div class="iphone-btn action"></div><div class="iphone-btn power"></div>
    <div class="apple-logo"></div>
  </div>
  <div class="device">
    <div class="power-btn" id="pwr" title="Encender / apagar" role="button" tabindex="0"></div>
    <div class="screen-bezel">
      <div class="screen-wrap" id="sw">
        <canvas id="cv" width="480" height="800"></canvas>
      </div>
    </div>
    <div class="btn-bar">
      <div class="hw-btn" data-k="Left"  title="Anterior · inicio (largo)">◀</div>
      <div class="hw-btn" data-k="Right" title="Siguiente · confirmar (largo)">▶</div>
    </div>
    <div class="usb"></div>
    <div class="brand">libritox</div>
  </div>
</div>
<div class="legend">
  <span><kbd>◀</kbd> anterior · <kbd>Shift+◀</kbd> largo</span>
  <span><kbd>▶</kbd> siguiente · <kbd>Shift+▶</kbd> largo</span>
  <span>arrastra un <kbd>.txt</kbd></span>
</div>

<script>
const W=480,H=800,PAD_X=22,STATUS_H=36;
const C_BG="#d9d4be",C_INK="#1a1710",C_MID="#8a8470",C_BAR="#c0bba8";
const F=[{px:14,ch:48},{px:16,ch:42},{px:20,ch:34}];
const SC={LIB:0,READ:1,BMENU:2,STATS:3,CAL:4};
const MOPTS=["Continuar leyendo","Estadísticas","Tamaño de letra","Volver a biblioteca"];
let scene=SC.LIB,cursor=0,bookIdx=-1,pageIdx=0,menuOpt=0,fontSize=1;
let calY=new Date().getFullYear(),calM=new Date().getMonth();
const books=[];
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),sw=document.getElementById("sw");

const LK="libritox_v1";
function ld(){try{return JSON.parse(localStorage.getItem(LK)||"{}")}catch{return{}}}
function sd(d){try{localStorage.setItem(LK,JSON.stringify(d))}catch{}}
function ds(dt=new Date()){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function recPage(name){const d=ld();if(!d.s)d.s={};const k=ds();if(!d.s[k])d.s[k]={};d.s[k][name]=(d.s[k][name]||0)+1;sd(d)}
function streak(){const s=(ld().s||{});let n=0,t=new Date();for(let i=0;i<365;i++){const dt=new Date(t);dt.setDate(t.getDate()-i);const pgs=s[ds(dt)];if(pgs&&Object.values(pgs).reduce((a,b)=>a+b,0)>0)n++;else if(i>0)break;}return n}
function weekly(){const s=(ld().s||{});return Array.from({length:7},(_,i)=>{const dt=new Date();dt.setDate(dt.getDate()-6+i);const pgs=s[ds(dt)];return{day:dt.getDay(),n:pgs?Object.values(pgs).reduce((a,b)=>a+b,0):0}})}
function mdata(y,m){const s=(ld().s||{}),res={},days=new Date(y,m+1,0).getDate();for(let d=1;d<=days;d++){const k=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;if(s[k])res[d]=Object.values(s[k]).reduce((a,b)=>a+b,0)}return res}
function etaFor(book){if(!book)return null;const avg=weekly().reduce((a,b)=>a+b.n,0)/7;if(avg<0.3)return null;const left=Math.ceil((book.pages.length-pageIdx-1)/avg);const dt=new Date();dt.setDate(dt.getDate()+left);return{days:left,date:dt}}

(function seed(){const d=ld();if(d.seeded)return;const s={};const t=new Date();[[0,4],[1,6],[2,7],[3,5],[4,9],[5,4],[6,6],[8,3],[9,5],[10,7],[11,4],[12,8],[13,3]].forEach(([da,pg])=>{const dt=new Date(t);dt.setDate(t.getDate()-da);const k=ds(dt);if(!s[k])s[k]={};s[k]["Don Quijote (muestra)"]=pg});sd({...d,s,seeded:true})})();

function paginate(text,name){const f=F[fontSize],lineH=f.px+11,pageLines=Math.floor((H-48-STATUS_H-lineH)/lineH);const words=text.replace(/\r\n/g,"\n").split(/[ \t\n]+/).filter(Boolean);const pages=[];let lines=[],line="";const fLine=()=>{if(line){lines.push(line);line=""}};const fPage=()=>{if(lines.length){pages.push([...lines]);lines=[]}};for(const w of words){const t=line?line+" "+w:w;if(t.length>f.ch&&line){fLine();if(lines.length>=pageLines)fPage();line=w}else line=t}fLine();fPage();return{name:name.replace(/\.[^.]+$/,""),pages:pages.length?pages:[["(vacío)"]],raw:text,cur:0}}

let rfBusy=false;
function refresh(draw,quick){if(quick||rfBusy){draw();return}rfBusy=true;sw.className="screen-wrap rf-b";setTimeout(()=>{sw.className="screen-wrap rf-w";setTimeout(()=>{draw();sw.className="screen-wrap rf-off";setTimeout(()=>{sw.className="screen-wrap";rfBusy=false},55)},85)},85)}

function cls(){ctx.fillStyle=C_BG;ctx.fillRect(0,0,W,H)}
function statusBar(label=""){const t=new Date(),hm=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"),str=streak();ctx.font="11px ui-sans-serif,system-ui,sans-serif";ctx.fillStyle=C_MID;ctx.textAlign="left";ctx.fillText(hm,PAD_X,20);if(label){ctx.textAlign="center";ctx.fillText(label,W/2,20)}if(str>0){ctx.textAlign="right";ctx.fillText("🔥 "+str,W-PAD_X,20)}ctx.fillStyle=C_INK;ctx.fillRect(PAD_X,26,W-PAD_X*2,1)}
function divLine(y){ctx.fillStyle=C_BAR;ctx.fillRect(PAD_X,y,W-PAD_X*2,1)}
function hints(l,r){ctx.font="10px ui-sans-serif,system-ui,sans-serif";ctx.fillStyle=C_MID;ctx.textAlign="left";if(l)ctx.fillText("◀ "+l,PAD_X,H-18);ctx.textAlign="right";if(r)ctx.fillText(r+" ▶",W-PAD_X,H-18)}

function drawLib(){cls();statusBar();ctx.fillStyle=C_INK;ctx.textAlign="left";ctx.font="bold 24px Georgia,serif";ctx.fillText("Biblioteca",PAD_X,58);if(!books.length){ctx.fillStyle=C_MID;ctx.font="14px Georgia,serif";ctx.fillText("Arrastra un .txt aquí.",PAD_X,108);ctx.fillText("— o explora estadísticas ◀",PAD_X,136);hints("estadísticas","");return}const iH=76;books.forEach((b,i)=>{const y=68+i*iH,sel=i===cursor;if(sel){ctx.fillStyle=C_INK;ctx.fillRect(0,y,W,iH)}const ink=sel?C_BG:C_INK,mid=sel?"rgba(217,212,190,.65)":C_MID,pct=Math.round(((b.cur||0)/Math.max(b.pages.length-1,1))*100);ctx.fillStyle=ink;ctx.font="bold 16px Georgia,serif";ctx.textAlign="left";ctx.fillText(b.name.length>26?b.name.slice(0,25)+"…":b.name,PAD_X,y+22);ctx.fillStyle=mid;ctx.font="11px ui-sans-serif,system-ui,sans-serif";ctx.textAlign="right";ctx.fillText(`${b.cur||0}/${b.pages.length} págs.`,W-PAD_X,y+22);const bw=W-PAD_X*2;ctx.fillStyle=sel?"rgba(217,212,190,.25)":C_BAR;ctx.fillRect(PAD_X,y+28,bw,3);if(pct>0){ctx.fillStyle=ink;ctx.fillRect(PAD_X,y+28,Math.round(bw*pct/100),3)}const e=etaFor(b);ctx.fillStyle=mid;ctx.font="11px ui-sans-serif,system-ui,sans-serif";ctx.textAlign="left";ctx.fillText(e?`~${e.days} días para terminar`:`${pct}% completado`,PAD_X,y+54);if(!sel)divLine(y+iH-1)});hints("estadísticas",cursor<books.length-1?"siguiente":"abrir")}

function drawRead(){const b=books[bookIdx];if(!b){scene=SC.LIB;drawLib();return}const f=F[fontSize],lineH=f.px+11,lines=b.pages[pageIdx]||[];cls();const short=b.name.length>18?b.name.slice(0,17)+"…":b.name;statusBar(short+"  "+(pageIdx+1)+"/"+b.pages.length);ctx.fillStyle=C_INK;ctx.textAlign="left";ctx.font=f.px+"px Georgia,serif";lines.forEach((l,i)=>ctx.fillText(l,PAD_X,42+(i+1)*lineH));ctx.fillStyle=C_INK;ctx.fillRect(0,H-STATUS_H,W,1);const pct=Math.round(((pageIdx+1)/b.pages.length)*100),e=etaFor(b);ctx.font="11px ui-sans-serif,system-ui,sans-serif";ctx.fillStyle=C_MID;ctx.textAlign="left";ctx.fillText(pct+"%",PAD_X,H-STATUS_H/2+5);if(e){ctx.textAlign="right";ctx.fillText("~"+e.days+"d",W-PAD_X,H-STATUS_H/2+5)}const bx=PAD_X+32,bw2=W-PAD_X*2-64;ctx.fillStyle=C_BAR;ctx.fillRect(bx,H-STATUS_H/2+1,bw2,3);ctx.fillStyle=C_INK;ctx.fillRect(bx,H-STATUS_H/2+1,Math.round(bw2*(pageIdx+1)/b.pages.length),3)}

function drawBMenu(){drawRead();ctx.fillStyle="rgba(26,23,16,.52)";ctx.fillRect(0,0,W,H);const mx=PAD_X,my=160,mw=W-PAD_X*2,mh=260;ctx.fillStyle=C_BG;ctx.fillRect(mx,my,mw,mh);ctx.strokeStyle=C_INK;ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);const b=books[bookIdx];ctx.fillStyle=C_INK;ctx.font="bold 14px Georgia,serif";ctx.textAlign="left";ctx.fillText(b?b.name.slice(0,22):"",mx+14,my+24);divLine(my+32);const sz=["S","M","L"];MOPTS.forEach((opt,i)=>{const oy=my+54+i*48,sel=i===menuOpt;if(sel){ctx.fillStyle=C_INK;ctx.fillRect(mx,oy-20,mw,36)}ctx.fillStyle=sel?C_BG:C_INK;ctx.font="15px Georgia,serif";ctx.textAlign="left";const lbl=i===2?opt+"  "+sz.map((s,si)=>si===fontSize?"["+s+"]":s).join(" "):opt;ctx.fillText(lbl,mx+14,oy)});ctx.font="10px ui-sans-serif,system-ui,sans-serif";ctx.fillStyle=C_MID;ctx.textAlign="center";ctx.fillText("◀/▶ navegar   ◀◀ cerrar   ▶▶ seleccionar",W/2,H-22)}

function drawStats(){cls();statusBar();ctx.fillStyle=C_INK;ctx.textAlign="left";ctx.font="bold 24px Georgia,serif";ctx.fillText("Estadísticas",PAD_X,58);const str=streak(),wk=weekly(),today2=wk[6].n,tot=wk.reduce((a,b)=>a+b.n,0);ctx.fillStyle=C_INK;ctx.fillRect(PAD_X,70,W-PAD_X*2,62);ctx.fillStyle=C_BG;ctx.font="bold 26px Georgia,serif";ctx.textAlign="center";ctx.fillText(str+" días seguidos 🔥",W/2,112);ctx.fillStyle=C_INK;ctx.font="bold 22px Georgia,serif";ctx.textAlign="center";ctx.fillText(String(today2),W/4,172);ctx.fillText(String(tot),3*W/4,172);ctx.font="11px ui-sans-serif,system-ui,sans-serif";ctx.fillStyle=C_MID;ctx.fillText("páginas hoy",W/4,192);ctx.fillText("esta semana",3*W/4,192);divLine(206);const cY=224,cH=172,cW=W-PAD_X*2,maxN=Math.max(...wk.map(d=>d.n),1),bW=Math.floor(cW/7*.54),bG=cW/7,DL=["L","M","X","J","V","S","D"];wk.forEach((d,i)=>{const bx=PAD_X+i*bG+(bG-bW)/2,bh=d.n>0?Math.max(4,Math.round(d.n/maxN*cH)):0,by=cY+cH-bh;ctx.fillStyle=i===6?C_INK:(d.n>0?C_MID:C_BAR);if(bh>0)ctx.fillRect(Math.round(bx),by,bW,bh);if(d.n>0){ctx.fillStyle=i===6?C_BG:C_INK;ctx.font="9px ui-sans-serif,system-ui,sans-serif";ctx.textAlign="center";ctx.fillText(String(d.n),bx+bW/2,by-3)}ctx.fillStyle=i===6?C_INK:C_MID;ctx.font=(i===6?"bold ":"")+"10px ui-sans-serif,system-ui,sans-serif";ctx.textAlign="center";ctx.fillText(DL[d.day===0?6:d.day-1],bx+bW/2,cY+cH+16)});ctx.fillStyle=C_INK;ctx.fillRect(PAD_X,cY+cH,cW,1);hints("biblioteca","calendario")}

function drawCal(){cls();statusBar();const MN=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],DL=["L","M","X","J","V","S","D"];ctx.fillStyle=C_INK;ctx.font="bold 20px Georgia,serif";ctx.textAlign="center";ctx.fillText(MN[calM]+" "+calY,W/2,56);divLine(64);const colW=(W-PAD_X*2)/7;DL.forEach((d,i)=>{ctx.font="11px ui-sans-serif,system-ui,sans-serif";ctx.fillStyle=C_MID;ctx.textAlign="center";ctx.fillText(d,PAD_X+i*colW+colW/2,82)});const md=mdata(calY,calM),days2=new Date(calY,calM+1,0).getDate(),maxN2=Math.max(...Object.values(md),1),fd=new Date(calY,calM,1).getDay(),sCol=fd===0?6:fd-1,today3=new Date(),rowH=86,sY=90;for(let day=1;day<=days2;day++){const slot=sCol+day-1,col=slot%7,row=Math.floor(slot/7),cx=PAD_X+col*colW+colW/2,cy=sY+row*rowH+rowH/2-4,isT=calY===today3.getFullYear()&&calM===today3.getMonth()&&day===today3.getDate(),pgs=md[day]||0;if(isT){ctx.strokeStyle=C_INK;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,16,0,Math.PI*2);ctx.stroke()}if(pgs>0){const r=5+Math.round(pgs/maxN2*11);ctx.globalAlpha=0.22+pgs/maxN2*.78;ctx.fillStyle=C_INK;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.fillStyle=pgs>0?C_BG:C_INK;ctx.font=(isT?"bold ":"")+"11px ui-sans-serif,system-ui,sans-serif";ctx.textAlign="center";ctx.fillText(String(day),cx,cy+4)}divLine(H-96);const str=streak();ctx.font="12px ui-sans-serif,system-ui,sans-serif";ctx.fillStyle=C_INK;ctx.textAlign="left";if(str>0)ctx.fillText("Racha actual: "+str+" días 🔥",PAD_X,H-76);if(bookIdx>=0&&books[bookIdx]){const e=etaFor(books[bookIdx]);if(e){const mn=MN[e.date.getMonth()].slice(0,3);ctx.fillStyle=C_MID;ctx.font="11px ui-sans-serif,system-ui,sans-serif";ctx.fillText("A este ritmo: terminas el "+e.date.getDate()+" "+mn+". (~"+e.days+"d)",PAD_X,H-52)}}hints("mes ant.","mes sig.")}

function render(quick){const fns={[SC.LIB]:drawLib,[SC.READ]:drawRead,[SC.BMENU]:drawBMenu,[SC.STATS]:drawStats,[SC.CAL]:drawCal};refresh(fns[scene],quick)}

function key(a){switch(scene){case SC.LIB:if(a==="Right"){if(cursor<books.length-1){cursor++;render(true)}else if(books.length){bookIdx=cursor;pageIdx=books[bookIdx].cur||0;scene=SC.READ;render()}}else if(a==="Left"){if(cursor>0){cursor--;render(true)}else{scene=SC.STATS;render()}}else if(a==="LongRight"&&books.length){bookIdx=cursor;pageIdx=books[bookIdx].cur||0;scene=SC.READ;render()}else if(a==="LongLeft"){scene=SC.STATS;render()}break;case SC.READ:{const b=books[bookIdx];if(!b){scene=SC.LIB;render();break}if(a==="Right"&&pageIdx<b.pages.length-1){pageIdx++;b.cur=pageIdx;recPage(b.name);render()}else if(a==="Left"&&pageIdx>0){pageIdx--;b.cur=pageIdx;render()}else if(a==="LongLeft"){scene=SC.LIB;render()}else if(a==="LongRight"){menuOpt=0;scene=SC.BMENU;render(true)}break}case SC.BMENU:if(a==="Right"){menuOpt=(menuOpt+1)%MOPTS.length;render(true)}else if(a==="Left"){menuOpt=(menuOpt-1+MOPTS.length)%MOPTS.length;render(true)}else if(a==="LongLeft"){scene=SC.READ;render(true)}else if(a==="LongRight"){switch(menuOpt){case 0:scene=SC.READ;render();break;case 1:scene=SC.STATS;render();break;case 2:fontSize=(fontSize+1)%3;books.forEach(b2=>{const p=paginate(b2.raw,b2.name+"x");p.name=b2.name;b2.pages=p.pages;b2.cur=Math.min(b2.cur||0,p.pages.length-1)});pageIdx=books[bookIdx]?.cur||0;scene=SC.READ;render();break;case 3:scene=SC.LIB;render();break}}break;case SC.STATS:if(a==="Right"){scene=SC.CAL;render()}else if(a==="Left"||a==="LongLeft"||a==="LongRight"){scene=SC.LIB;render()}break;case SC.CAL:if(a==="Left"){calM--;if(calM<0){calM=11;calY--}render(true)}else if(a==="Right"){calM++;if(calM>11){calM=0;calY++}render(true)}else if(a==="LongLeft"||a==="LongRight"){scene=SC.LIB;render()}break}}

const pSt={},lF={};
document.querySelectorAll(".hw-btn").forEach(btn=>{const k=btn.dataset.k;btn.addEventListener("pointerdown",()=>{btn.classList.add("pressed");pSt[k]=Date.now();lF[k]=false;btn._lt=setTimeout(()=>{lF[k]=true;key("Long"+k)},600)});const up=()=>{btn.classList.remove("pressed");clearTimeout(btn._lt);if(!lF[k])key(k);pSt[k]=0};btn.addEventListener("pointerup",up);btn.addEventListener("pointerleave",up)});
document.getElementById("pwr").addEventListener("click",()=>render());
document.addEventListener("keydown",e=>{const m={ArrowLeft:"Left",ArrowRight:"Right"};if(e.shiftKey&&m[e.key]){e.preventDefault();key("Long"+m[e.key]);return}if(m[e.key]){e.preventDefault();key(m[e.key])}});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();[...(e.dataTransfer?.files||[])].forEach(f=>{if(!f.name.match(/\.txt$/i))return;const r=new FileReader();r.onload=ev=>{const b=paginate(ev.target.result,f.name);books.push(b);if(scene===SC.LIB)render(true)};r.readAsText(f,"utf-8")})});

const SAMPLE=`En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor. Una olla de algo más vaca que carnero, salpicón las más noches, duelos y quebrantos los sábados, lantejas los viernes, algún palomino de añadidura los domingos, consumían las tres partes de su hacienda. El resto della concluían sayo de velarte, calzas de velludo para las fiestas con sus pantuflos de lo mismo, y los días de entre semana se honraba con su vellorí de lo más fino. Tenía en su casa una ama que pasaba de los cuarenta, y una sobrina que no llegaba a los veinte, y un mozo de campo y plaza que así ensillaba el rocín como tomaba la podadera. Frisaba la edad de nuestro hidalgo con los cincuenta años, era de complexión recia, seco de carnes, enjuto de rostro; gran madrugador y amigo de la caza.
Es, pues, de saber, que este sobredicho hidalgo, los ratos que estaba ocioso se daba a leer libros de caballerías con tanta afición y gusto, que olvidó casi de todo punto el ejercicio de la caza, y aun la administración de su hacienda; y llegó a tanto su curiosidad y desatino en esto, que vendió muchas hanegas de tierra de sembradura para comprar libros de caballerías en que leer.
En resolución, él se enfrascó tanto en su lectura, que se le pasaban las noches leyendo de claro en claro, y los días de turbio en turbio, y así, del poco dormir y del mucho leer, se le secó el cerebro, de manera que vino a perder el juicio.
Decía él que el Cid Ruy Díaz había sido muy buen caballero, pero que no tenía que ver con el Caballero de la Ardiente Espada, que de sólo un revés había partido por medio dos fieros y descomunales gigantes.
En efeto, rematado ya su juicio, vino a dar en el más estraño pensamiento que jamás dio loco en el mundo; y fue que le pareció convenible y necesario, así para el aumento de su honra como para el servicio de su república, hacerse caballero andante, y irse por todo el mundo con sus armas y caballo a buscar las aventuras.
Limpias, pues, sus armas, hecho del morrión celada, puesto nombre a su rocín y confirmándose a sí mismo, se dio a entender que no le faltaba otra cosa sino buscar una dama de quien enamorarse; porque el caballero andante sin amores era árbol sin hojas y sin fruto y cuerpo sin alma.
Oh, cómo se holgó nuestro buen caballero cuando hubo hecho este discurso, y más cuando halló a quien dar nombre de su dama. Llamábase Aldonza Lorenzo, y a ésta le pareció ser bien darle título de señora de sus pensamientos; vino a llamarla Dulcinea del Toboso; nombre, a su parecer, músico y peregrino y significativo, como todos los demás que a él y a sus cosas había puesto.`;

const demo=paginate(SAMPLE,"Don Quijote (muestra).txt");
demo.cur=5;
books.push(demo);
bookIdx=0;
render();
</script>
